<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boa noite meu mundo</title>
<style>
:root{--bg:#02030a;--txt:#dfe8ff;--soft:#9fb4e8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.msg{position:fixed;left:0;right:0;text-align:center;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--txt);opacity:0;transform:translateY(10px);transition:opacity 2.4s ease,transform 2.4s ease;padding:0 24px;text-shadow:0 0 14px rgba(120,160,255,.55)}
.msg.on{opacity:1;transform:none}
#m1{top:60%;font-size:clamp(20px,6.4vw,34px);letter-spacing:.04em}
#m2{top:68%;font-size:clamp(15px,4.6vw,24px);color:var(--soft)}
#hint{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font:12px ui-monospace,Menlo,monospace;color:#56638c;opacity:0;transition:opacity 1.5s}
#hint.on{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="msg" id="m1">boa noite meu mundo</div>
<div class="msg" id="m2">eu te amo daqui até a lua</div>
<div id="hint">toque para rever</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const m1=document.getElementById('m1'),m2=document.getElementById('m2'),hint=document.getElementById('hint');
let W,H,D,R,S,cx,cy,cell,stars=[],t0=performance.now();
const ramp=" .,:;-~=+*xoO#%@8&";
function resize(){
  D=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*D;cv.height=H*D;g.setTransform(D,0,0,D,0,0);
  R=Math.min(W*.18,H*.13);S=Math.min(W*.26,R*1.6);cx=W/2;cy=H*.34;cell=Math.max(5,R/11);
  stars=[];for(let i=0;i<70;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()<.4?3+Math.random()*5:1,p:Math.random()*6.28,v:.6+Math.random()*1.6});
}
addEventListener('resize',resize);resize();
const ease=k=>k<=0?0:k>=1?1:k*k*(3-2*k);
function pos(t){
  if(t<2)return 1;
  if(t<7)return 1-ease((t-2)/5);
  if(t<9)return 0;
  if(t<14)return -ease((t-9)/5);
  return -1;
}
function h(a,b,c){let n=(a*374761393+b*668265263+c*2147483647)|0;n=(n^(n>>>13))*1274126177|0;return((n^(n>>>16))>>>0)/4294967295}
const craters=[[-.3,-.15,.2],[.25,.2,.25],[.1,-.45,.14],[-.1,.45,.16],[.5,-.2,.12]];
function body(x,y,type,t,skipX,skipY){
  const gl=g.createRadialGradient(x,y,R*.6,x,y,R*1.9);
  gl.addColorStop(0,type?'rgba(60,110,255,.22)':'rgba(255,170,50,.20)');gl.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gl;g.fillRect(x-R*2,y-R*2,R*4,R*4);
  g.font=(cell*1.25)+'px ui-monospace,Menlo,Consolas,monospace';g.textAlign='center';g.textBaseline='middle';
  const n=Math.ceil(R/cell),f=Math.floor(t*5);
  for(let j=-n;j<=n;j++)for(let i=-n;i<=n;i++){
    const px=x+i*cell,py=y+j*cell,u=(i*cell)/R,v=(j*cell)/R,r2=u*u+v*v;
    if(r2>1)continue;
    if(skipX!==undefined&&Math.hypot(px-skipX,py-skipY)<R)continue;
    const nz=Math.sqrt(1-r2);
    let b=Math.max(0,(-.45*u-.4*v+.8*nz))*.85+.15;
    if(type){for(const c of craters){const d=Math.hypot(u-c[0],v-c[1]);if(d<c[2])b*=.55+.45*(d/c[2])}}
    else{b*=.8+.25*Math.sin(u*9+t*.6)*Math.sin(v*8-t*.5)+.1*Math.sin((u+v)*17+t)}
    b=Math.max(0,Math.min(1,b+(h(i,j,f)-.5)*.16));
    const k=Math.min(ramp.length-1,Math.floor(b*ramp.length));
    if(k<1)continue;
    g.fillStyle=type?`hsl(${215+b*18},95%,${28+b*46}%)`:`hsl(${28+b*22},95%,${30+b*42}%)`;
    g.fillText(ramp[k],px,py);
  }
}
function frame(now){
  const t=(now-t0)/1000;
  g.clearRect(0,0,W,H);
  for(const s of stars){
    const a=.25+.75*Math.abs(Math.sin(t*s.v+s.p));
    g.globalAlpha=a;g.fillStyle='#cfdcff';
    if(s.s>1){g.fillRect(s.x-s.s,s.y-.5,s.s*2,1);g.fillRect(s.x-.5,s.y-s.s,1,s.s*2)}
    else g.fillRect(s.x,s.y,1.3,1.3);
  }
  g.globalAlpha=1;
  const p=pos(t),bob=Math.sin(t*1.2)*3;
  const sx=cx+S*p,mx=cx-S*p;
  body(sx,cy+bob,0,t,mx,cy-bob);
  body(mx,cy-bob,1,t);
  m1.classList.toggle('on',t>14.5);
  m2.classList.toggle('on',t>18.5);
  hint.classList.toggle('on',t>24);
  requestAnimationFrame(frame);
}
addEventListener('pointerdown',()=>{if((performance.now()-t0)/1000>20){t0=performance.now();m1.classList.remove('on');m2.classList.remove('on');hint.classList.remove('on')}});
requestAnimationFrame(frame);
</script>
</body>
</html>
